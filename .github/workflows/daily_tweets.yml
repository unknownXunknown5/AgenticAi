name: Agentic AI Daily Tweet Publisher

on:
  schedule:
    # GitHub Actions cron runs in UTC.
    # Asia/Kolkata (IST) is UTC + 5:30.
    # 04:30 UTC = 10:00 AM IST (Morning Tweet)
    - cron: '30 4 * * *'
    # 09:30 UTC = 03:00 PM IST (Afternoon Tweet)
    - cron: '30 9 * * *'
    # 14:30 UTC = 08:00 PM IST (Evening Tweet)
    - cron: '30 14 * * *'

  # Allows manual execution from the GitHub Actions UI anytime
  workflow_dispatch:

jobs:
  publish_tweet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./01

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: '01/requirements.txt'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers and system dependencies
        run: |
          playwright install chromium --with-deps

      - name: Setup session cookies if secret is provided
        run: |
          mkdir -p data
          if [ -n "${{ secrets.X_COOKIES_JSON }}" ]; then
            echo '${{ secrets.X_COOKIES_JSON }}' > data/cookies.json
          fi

      - name: Run Agentic AI Pipeline to Generate and Publish Tweet
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          X_AUTH_TOKEN: ${{ secrets.X_AUTH_TOKEN }}
          X_CT0: ${{ secrets.X_CT0 }}
          TIMEZONE: "Asia/Kolkata"
        run: |
          python -m nodes.main
